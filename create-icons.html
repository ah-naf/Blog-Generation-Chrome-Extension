<!DOCTYPE html>
<html>
<head>
  <title>Create Extension Icons</title>
</head>
<body>
  <h2>Extension Icon Generator</h2>
  <p>Open browser console and run the script to download icons</p>

  <script>
    // Simple icon generator for placeholder icons
    function createIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Gradient background
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#0ea5e9');
      gradient.addColorStop(1, '#0369a1');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // Add "AI" text
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.4}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('AI', size / 2, size / 2);

      // Download
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // Create all icon sizes
    console.log('Creating icons...');
    setTimeout(() => createIcon(16), 100);
    setTimeout(() => createIcon(48), 300);
    setTimeout(() => createIcon(128), 500);
    console.log('Check your downloads folder for icon files');
    console.log('Move them to public/icons/ directory');
  </script>
</body>
</html>
